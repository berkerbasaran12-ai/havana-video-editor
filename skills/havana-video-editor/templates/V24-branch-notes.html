<!doctype html>
<!--
  V24 · Object + branching notes  (TR: Nesne + dallanan notlar)
  ----------------------------------------------------------------
  Full-screen insert, 1080x1920. Hard cut in, voice keeps running, no captions, hard cut out.
  - Light background with a soft grey vignette.
  - One big glossy object for the topic. It enters frame-filling (scale 2.8) and zooms out to
    its place in about 0.8 s (easeOutExpo). The accent part (e.g. a magnifier) pops in after it with a small overshoot.
  - One lowercase line under it. Emphasis is weight only (bold vs regular, no colour).
    End it with ".." when it leads into the branches.
  - Thin black curved branches (4 px at 1080) draw down from the line, one per note, each
    as the note is spoken; the note fades in at the branch tip. Only as many branches as
    notes. Never draw an empty decorative branch.
  - Slow camera push 1.00 → 1.04 over the whole insert.
  Everything is a pure function of time t (seconds from the cut-in) → render(t), so it can be
  seeked frame-accurately (HyperFrames, headless snapshots). Open with ?t=2.5 for a still.
  Edit CONFIG below; times are relative to the cut-in.
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V24 Branch Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#111; }
  body { display:grid; place-items:center; }
  .stage { position:relative; height:min(96vh, 1920px); aspect-ratio:9/16; overflow:hidden; container-type:inline-size; }
  .bg { position:absolute; inset:0; background:radial-gradient(ellipse 75% 60% at 50% 42%, #fff 40%, #ececec 70%, #cfcfcf 100%); }
  .cam { position:absolute; inset:0; transform-origin:50% 45%; }
  svg.d { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .br { fill:none; stroke:#141414; stroke-width:4; stroke-linecap:round; }
  .tx { position:absolute; font:400 4.7cqw/1 "Inter", sans-serif; letter-spacing:-.025em; color:#141414; white-space:nowrap; text-shadow:0 .2cqw .7cqw rgba(0,0,0,.14); }
  .tx b { font-weight:700; }
  .tx span { display:inline-block; }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="bg"></div><div class="cam" id="cam"></div></div>
<script>
const CONFIG = {
  duration: 7.0,
  // Object, drawn in 1080x1920 space. `base` zooms out from big; `accent` pops in after.
  object: {
    center: [540, 600], scale: 1.34, origin: [585, 530],
    base: `<g filter="url(#sh)" transform="rotate(-7 520 520)">
      <rect x="360" y="300" width="320" height="410" rx="30" fill="#fff"/>
      <rect x="410" y="370" width="220" height="20" rx="10" fill="#d6dae1"/>
      <rect x="410" y="420" width="190" height="20" rx="10" fill="#d6dae1"/>
      <rect x="410" y="470" width="220" height="20" rx="10" fill="#d6dae1"/>
      <rect x="410" y="520" width="140" height="20" rx="10" fill="#d6dae1"/>
      <rect x="410" y="600" width="120" height="20" rx="10" fill="#e9ecf1"/></g>`,
    baseOrigin: [520, 505],
    accent: `<g filter="url(#sh)">
      <line x1="712" y1="652" x2="812" y2="752" stroke="#f2b01e" stroke-width="58" stroke-linecap="round"/>
      <circle cx="640" cy="580" r="112" fill="rgba(255,255,255,.55)" stroke="#2d6fdc" stroke-width="40"/>
      <text x="640" y="622" text-anchor="middle" font-family="Inter" font-weight="700" font-size="120" fill="#2d6fdc">?</text></g>`,
    accentOrigin: [700, 640], accentAt: 0.6
  },
  // Main line: words as [text, bold, at]
  main: { top: 975, left: 104, words: [["paragrafta", true, 0.16], ["önemli", false, 1.26], ["olan..", false, 1.61]] },
  // One branch per note. at = when the branch starts drawing (the note follows ~0.4 s later).
  branches: [
    { at: 2.01, words: [["metni", true], ["anlamak?", false]] },
    { at: 5.00, words: [["sorunun", true], ["ne istediği?", false]] }
  ],
  branchGap: 148, firstBranchDrop: 122, branchX: 335
};

const stage = document.getElementById('stage'), cam = document.getElementById('cam');
const C = CONFIG, O = C.object, cq = px => (px / 10.8) + 'cqw';
const y0 = C.main.top + 55;
const ends = C.branches.map((b, i) => y0 + C.firstBranchDrop + i * C.branchGap);
const paths = C.branches.map((b, i) => {
  const x0 = 168 - 6 * i, yi = ends[i];
  return `<path class="br" d="M${x0} ${y0} C${x0 - 18} ${y0 + (yi - y0) * .72} 200 ${yi} ${C.branchX - 13} ${yi}"/>`;
}).join('');
cam.innerHTML = `<svg class="d" viewBox="0 0 1080 1920">
  <defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".18"/></filter></defs>
  <g transform="translate(${O.center[0]} ${O.center[1]}) scale(${O.scale}) translate(${-O.origin[0]} ${-O.origin[1]})">
    <g id="base" style="transform-box:view-box; transform-origin:${O.baseOrigin[0]}px ${O.baseOrigin[1]}px">${O.base}</g>
    <g id="accent" style="transform-box:view-box; transform-origin:${O.accentOrigin[0]}px ${O.accentOrigin[1]}px">${O.accent || ''}</g>
  </g>${paths}</svg>`;
const wordsHTML = ws => ws.map(([w, b]) => `<span>${b ? `<b>${w}</b>` : w}</span>`).join(' ');
const main = document.createElement('div'); main.className = 'tx'; main.style.left = cq(C.main.left); main.style.top = cq(C.main.top);
main.innerHTML = wordsHTML(C.main.words); cam.appendChild(main);
const notes = C.branches.map((b, i) => {
  const d = document.createElement('div'); d.className = 'tx'; d.style.left = cq(C.branchX); d.style.top = cq(ends[i] - 27);
  d.innerHTML = wordsHTML(b.words); cam.appendChild(d); return d;
});
const base = document.getElementById('base'), accent = document.getElementById('accent');
const pathEls = [...cam.querySelectorAll('.br')].map(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; return [p, L]; });

const clamp = x => Math.min(1, Math.max(0, x));
const outExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const outCubic = k => 1 - Math.pow(1 - k, 3);
const outBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const fadeUp = (el, k) => { el.style.opacity = k; el.style.transform = `translateY(${(1 - outCubic(k)) * .6}cqw)`; };

function render(t) {
  base.style.opacity = clamp(t / 0.1);
  base.style.transform = `scale(${2.8 - 1.8 * outExpo(clamp(t / 0.8))})`;
  const ka = clamp((t - O.accentAt) / 0.5), g = ka > 0 ? outBack(ka) : 0;
  accent.style.opacity = clamp((t - O.accentAt) / 0.15);
  accent.style.transform = `translate(${60 * (1 - g)}px, ${60 * (1 - g)}px) scale(${0.7 + 0.3 * g}) rotate(${-12 * (1 - g)}deg)`;
  cam.style.transform = `scale(${1 + 0.04 * clamp(t / C.duration)})`;
  [...main.children].forEach((s, k) => fadeUp(s, clamp((t - C.main.words[k][2]) / 0.2)));
  C.branches.forEach((b, i) => {
    const [p, L] = pathEls[i];
    p.style.strokeDashoffset = L * (1 - outCubic(clamp((t - b.at) / 0.5)));
    [...notes[i].children].forEach((s, k) => fadeUp(s, clamp((t - b.at - 0.4 - k * 0.3) / 0.2)));
  });
}
window.render = render;   // for frame-accurate seeking by a renderer
const q = new URLSearchParams(location.search).get('t');
if (q !== null) render(+q);
else { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % (C.duration + 1)); requestAnimationFrame(loop); })(); }
</script>
</body>
</html>
